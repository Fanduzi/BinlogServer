name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run unit tests
        run: go test ./...

      - name: Resolve release note path
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="docs/releases/release-notes-${TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "missing release notes file: $NOTES_FILE" >&2
            exit 1
          fi
          echo "RELEASE_NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Run GoReleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Verify Linux binary compatibility
        run: make check-linux-compat VERSION="${GITHUB_REF_NAME}"

      - name: Prepare release archives without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish,announce --release-notes ${{ env.RELEASE_NOTES_FILE }}

      - name: Verify Linux release archive compatibility
        run: make check-linux-release-archive VERSION="${GITHUB_REF_NAME}"

      - name: Publish release assets
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ env.RELEASE_NOTES_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
