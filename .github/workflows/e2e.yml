        run: |
          E2E_DIR="./tmp/e2e/data-ci-gtid-pitr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          E2E_SERVER_LOG="/tmp/binlog-server-gtid-pitr.log" E2E_DATA_DIR="$E2E_DIR" ./scripts/e2e/run-suite.sh --scenarios smoke-gtid-pitr,smoke-gtid-executed

      - name: Dump Logs On Failure
