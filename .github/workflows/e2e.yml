          docker compose -f deploy/e2e/docker-compose.yml logs || true

      - name: Cleanup
        if: always()
        run: ./scripts/e2e/down.sh

  e2e-meta-failover:
    if: ${{ !github.event.inputs.e2e_profile || github.event.inputs.e2e_profile == 'meta-failover' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: E2E Meta Failover Scenario
        run: |
          E2E_DIR="./tmp/e2e/data-ci-meta-failover-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          E2E_SERVER_LOG="/tmp/binlog-server-meta-failover.log" E2E_DATA_DIR="$E2E_DIR" ./scripts/e2e/run-suite.sh --scenarios meta-failover

      - name: Dump Logs On Failure
        if: failure()
        run: |
          cat /tmp/binlog-server-meta-failover.log || true
          docker compose -f deploy/e2e/docker-compose.yml logs || true

      - name: Cleanup
        if: always()
        run: ./scripts/e2e/down.sh

  e2e-retry-upload:
    if: ${{ !github.event.inputs.e2e_profile || github.event.inputs.e2e_profile == 'retry-upload' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: E2E Retry Upload Scenario
        run: |
          E2E_DIR="./tmp/e2e/data-ci-retry-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          E2E_SERVER_LOG="/tmp/binlog-server-retry-upload.log" E2E_DATA_DIR="$E2E_DIR" ./scripts/e2e/run-suite.sh --scenarios smoke-retry-upload

      - name: Dump Logs On Failure
        if: failure()
        run: |
          cat /tmp/binlog-server-retry-upload.log || true
          docker compose -f deploy/e2e/docker-compose.yml logs || true

      - name: Cleanup
        if: always()
        run: ./scripts/e2e/down.sh

  e2e-upgrade-failback:
    # Legacy repair from v0.5.57 through 0a84917a (plain, object-only,
    # object-gone) plus a plain in-place upgrade from v0.5.82. object-only is
    # D2: after the repair, A rotates to a sealed boundary and split retention
    # (local 1 day, bucket 30) removes every segment before it from disk.
    # /replay/archive must GET each one from MinIO (mc admin trace), no copy
    # may appear under data_dir, the server TMPDIR or /tmp, and the bucket
    # members alone, restored with mysqlbinlog 8.0, must match A's CHECKSUM
    # TABLE at the boundary. The v0.5.57 legs build 0a84917a, so full history.
    name: e2e-upgrade-failback (${{ matrix.case }} from ${{ matrix.old_ref }})
    if: ${{ !github.event.inputs.e2e_profile || github.event.inputs.e2e_profile == 'upgrade-failback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: plain
            old_ref: v0.5.57
            skip_mid: "0"
            require_reuse: "1"
          - case: object-only
            old_ref: v0.5.57
            skip_mid: "0"
            require_reuse: "1"
          - case: object-gone
            old_ref: v0.5.57
            skip_mid: "0"
            require_reuse: "1"
          - case: plain
            old_ref: v0.5.82
            skip_mid: "1"
            require_reuse: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Fetch the MID build commit
        # 0a84917a is PR #293's merge commit; it is not reachable from any
        # branch, so a full clone still lacks it.
        run: git fetch --no-tags origin 0a84917a35276a243f2feeae29c97e0f2a4b2773

      - name: Check host mysqlbinlog is 8.0, install PyMySQL for the load writer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pymysql
          python3 -c 'import pymysql'
          mysqlbinlog --version
          mysqlbinlog --version | grep -Eq 'Ver 8\.0\.|Distrib 8\.0\.| 8\.0\.[0-9]+'

      - name: E2E Upgrade Failback (${{ matrix.case }} from ${{ matrix.old_ref }})
        env:
          FBUP_CASE: ${{ matrix.case }}
          FBUP_OLD_REF: ${{ matrix.old_ref }}
          FBUP_SKIP_MID: ${{ matrix.skip_mid }}
          FBUP_REQUIRE_REUSE: ${{ matrix.require_reuse }}
          FBUP_WORK: ${{ runner.temp }}/fbup
        run: ./scripts/e2e/upgrade-legacy-failback.sh

      - name: Dump Logs On Failure
        if: failure()
        run: |
          for f in "${RUNNER_TEMP}"/fbup/out/*; do echo "== $f"; tail -n 100 "$f"; done || true

  e2e-verify:
    # ADR 0009 phase 3 against a real MinIO (Quay image, GitHub release binary
    # as fallback; no registry login). No source database compose.
    if: ${{ !github.event.inputs.e2e_profile || github.event.inputs.e2e_profile == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: E2E Verify Against MinIO
        run: ./scripts/e2e/smoke-verify.sh

  e2e-split-retention:
