          E2E_DIR="./tmp/e2e/data-ci-split-retention-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          E2E_SERVER_LOG="/tmp/binlog-server-split-retention.log" E2E_DATA_DIR="$E2E_DIR" ./scripts/e2e/run-suite.sh --scenarios smoke-split-retention

      - name: Dump Logs On Failure
        if: failure()
        run: |
          cat /tmp/binlog-server-split-retention.log || true
          docker compose -f deploy/e2e/docker-compose.yml logs || true

      - name: Cleanup
        if: always()
        run: ./scripts/e2e/down.sh

  e2e-epoch-segments:
