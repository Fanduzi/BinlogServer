name: ci

on:
  push:
    branches:
      - main
  pull_request:
  # release.yml calls this whole workflow and builds only when every job here
  # passed on the tagged commit (production-readiness J3). A called workflow
  # sees the caller's event, so job conditions key on the e2e_profile input
  # (set only by a manual run of this workflow), never on github.event_name.
  workflow_call:
  workflow_dispatch:
    inputs:
      e2e_profile:
        description: "e2e profile to run"
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
          - cluster-roles
          - observability
          - worker-crash-recovery
          - retry-upload
          - split-retention
          - epoch-segments
          - gtid-purge
          - gtid-pitr
          - source-switchover
          - meta-failover
          - upgrade-failback
          - verify
          - tls

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""
          go-version-file: "go.mod"
          go-package: ./...

  release-archive:
    # Same goreleaser build and archive check as release.yml, as a snapshot:
    # the packaged binlog-server must report this commit and the built version.
    if: ${{ !github.event.inputs.e2e_profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build snapshot release archives
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot --skip=publish,announce

      - name: Verify Linux release archive, version and commit
        # This job always builds a snapshot, also when release.yml calls this
        # workflow for a tag, so the version is never the tag; release.yml
        # checks the tag version on its own build.
        env:
          RELEASE_IDENTITY_SNAPSHOT: "true"
        run: ./scripts/check-release-archive-identity.sh

  race-and-vet:
    if: ${{ !github.event.inputs.e2e_profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install strace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 -timeout 30m ./...

  unit-and-e2e:
    if: ${{ !github.event.inputs.e2e_profile || (github.event.inputs.e2e_profile != 'cluster-roles' && github.event.inputs.e2e_profile != 'observability' && github.event.inputs.e2e_profile != 'worker-crash-recovery' && github.event.inputs.e2e_profile != 'gtid-purge' && github.event.inputs.e2e_profile != 'gtid-pitr' && github.event.inputs.e2e_profile != 'source-switchover' && github.event.inputs.e2e_profile != 'verify' && github.event.inputs.e2e_profile != 'upgrade-failback' && github.event.inputs.e2e_profile != 'tls') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_PROFILE: ${{ github.event.inputs.e2e_profile || 'quick' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check Console locale messages
        working-directory: frontend
        run: |
          npm ci
          npm run test:locales

      - name: Check embedded Console bundle and PITR markers
        run: ./scripts/check-ui-bundle.sh

      - name: Check landing page image assets
        run: ./scripts/check-landing-assets.sh

      - name: Install strace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace

      - name: Unit Tests
        run: go test ./...

      - name: E2E Topology Contract
        run: make e2e-topology-check

      - name: sqlc Verify
        run: make sqlc-verify

      - name: E2E Suite
        env:
          E2E_MYSQL57_PORT: 23306
        run: |
          E2E_DIR="./tmp/e2e/data-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          E2E_SERVER_LOG="/tmp/binlog-server.log" E2E_DATA_DIR="$E2E_DIR" ./scripts/e2e/run-suite.sh --profile "$E2E_PROFILE"

      - name: Dump Logs On Failure
        if: failure()
        run: |
          cat /tmp/binlog-server.log || true
          docker compose -f deploy/e2e/docker-compose.yml logs || true

      - name: Cleanup
        if: always()
        run: ./scripts/e2e/down.sh

  e2e-cluster-roles:
    if: ${{ !github.event.inputs.e2e_profile || github.event.inputs.e2e_profile == 'cluster-roles' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: E2E Cluster Roles Scenario
        run: |
          E2E_DIR="./tmp/e2e/data-ci-cluster-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          E2E_SERVER_LOG="/tmp/binlog-server-cluster.log" E2E_DATA_DIR="$E2E_DIR" ./scripts/e2e/run-suite.sh --scenarios smoke-cluster-roles

      - name: Dump Logs On Failure
        if: failure()
        run: |
          cat /tmp/binlog-server-cluster.log || true
          docker compose -f deploy/e2e/docker-compose.yml logs || true

      - name: Cleanup
        if: always()
        run: ./scripts/e2e/down.sh

  e2e-observability:
    if: ${{ !github.event.inputs.e2e_profile || github.event.inputs.e2e_profile == 'observability' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: E2E Observability Scenario
        run: |
          E2E_DATA_DIR="./tmp/e2e/data-ci-observability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          E2E_SERVER_LOG="/tmp/binlog-server-observability.log" \
          make e2e-observability

      - name: Dump Logs On Failure
        if: failure()
        run: |
          cat /tmp/binlog-server-observability.log || true
          docker compose -f deploy/e2e/docker-compose.yml logs || true

      - name: Cleanup
        if: always()
        run: ./scripts/e2e/down.sh

  e2e-worker-crash-recovery:
    if: ${{ !github.event.inputs.e2e_profile || github.event.inputs.e2e_profile == 'worker-crash-recovery' }}
