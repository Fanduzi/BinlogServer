  e2e-source-switchover:
    if: ${{ !github.event.inputs.e2e_profile || github.event.inputs.e2e_profile == 'source-switchover' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
