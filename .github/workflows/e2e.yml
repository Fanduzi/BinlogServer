          cache: true

      - name: E2E Worker Crash Recovery Scenario
        run: |
          E2E_DIR="./tmp/e2e/data-ci-worker-crash-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          E2E_SERVER_LOG="/tmp/binlog-server-worker-crash.log" E2E_DATA_DIR="$E2E_DIR" ./scripts/e2e/run-suite.sh --scenarios smoke-worker-crash-recovery

      - name: Dump Logs On Failure
        if: failure()
        run: |
