name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      e2e_profile:
        description: "e2e profile to run"
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
          - cluster-roles
          - observability
          - worker-crash-recovery

permissions:
  contents: read

jobs:
  unit-and-e2e:
    if: ${{ github.event_name != 'workflow_dispatch' || (github.event.inputs.e2e_profile != 'cluster-roles' && github.event.inputs.e2e_profile != 'observability' && github.event.inputs.e2e_profile != 'worker-crash-recovery') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_PROFILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.e2e_profile || 'quick' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Unit Tests
        run: go test ./...

      - name: E2E Suite
        run: |
          E2E_DIR="./tmp/e2e/data-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          E2E_SERVER_LOG="/tmp/binlog-server.log" E2E_DATA_DIR="$E2E_DIR" ./scripts/e2e/run-suite.sh --profile "$E2E_PROFILE"

      - name: Dump Logs On Failure
        if: failure()
        run: |
          cat /tmp/binlog-server.log || true
          docker compose -f deploy/e2e/docker-compose.yml logs || true

      - name: Cleanup
        if: always()
        run: ./scripts/e2e/down.sh

  e2e-cluster-roles:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.e2e_profile == 'cluster-roles' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: E2E Cluster Roles Scenario
        run: |
          E2E_DIR="./tmp/e2e/data-ci-cluster-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          E2E_SERVER_LOG="/tmp/binlog-server-cluster.log" E2E_DATA_DIR="$E2E_DIR" ./scripts/e2e/run-suite.sh --scenarios smoke-cluster-roles

      - name: Dump Logs On Failure
        if: failure()
        run: |
          cat /tmp/binlog-server-cluster.log || true
          docker compose -f deploy/e2e/docker-compose.yml logs || true

      - name: Cleanup
        if: always()
        run: ./scripts/e2e/down.sh

  e2e-observability:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.e2e_profile == 'observability' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: E2E Observability Scenario
        run: |
          E2E_DIR="./tmp/e2e/data-ci-observability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          E2E_SERVER_LOG="/tmp/binlog-server-observability.log" E2E_DATA_DIR="$E2E_DIR" ./scripts/e2e/run-suite.sh --scenarios smoke-observability

      - name: Dump Logs On Failure
        if: failure()
        run: |
          cat /tmp/binlog-server-observability.log || true
          docker compose -f deploy/e2e/docker-compose.yml logs || true

      - name: Cleanup
        if: always()
        run: ./scripts/e2e/down.sh

  e2e-worker-crash-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.e2e_profile == 'worker-crash-recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: E2E Worker Crash Recovery Scenario
        run: |
          E2E_DIR="./tmp/e2e/data-ci-worker-crash-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          E2E_SERVER_LOG="/tmp/binlog-server-worker-crash.log" E2E_DATA_DIR="$E2E_DIR" ./scripts/e2e/run-suite.sh --scenarios smoke-worker-crash-recovery

      - name: Dump Logs On Failure
        if: failure()
        run: |
          cat /tmp/binlog-server-worker-crash.log || true
          docker compose -f deploy/e2e/docker-compose.yml logs || true

      - name: Cleanup
        if: always()
        run: ./scripts/e2e/down.sh
