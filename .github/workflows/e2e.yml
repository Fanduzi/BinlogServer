      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: E2E VIP Source Switchover Scenario
        run: |
          E2E_DIR="./tmp/e2e/data-ci-source-switchover-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          E2E_SERVER_LOG="/tmp/binlog-server-source-switchover.log" E2E_DATA_DIR="$E2E_DIR" ./scripts/e2e/run-suite.sh --scenarios smoke-source-switchover

      - name: Dump Logs On Failure
        if: failure()
        run: |
          cat /tmp/binlog-server-source-switchover.log || true
          docker compose -f deploy/e2e/docker-compose.yml logs || true

      - name: Cleanup
        if: always()
        run: ./scripts/e2e/down.sh

  e2e-tls:
    if: ${{ !github.event.inputs.e2e_profile || github.event.inputs.e2e_profile == 'tls' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: MySQL and S3 TLS
        env:
          BINLOG_TEST_TLS: "1"
        run: go test -count=1 -timeout 25m -run 'TestLiveMySQLTLS|TestLiveAppTLS|TestLiveS3TLS' ./internal/replication/ ./internal/app/ ./internal/upload/

  promtool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install promtool
        run: |
          curl -fsSL -o /tmp/prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install -m 0755 /tmp/prometheus-2.55.1.linux-amd64/promtool /usr/local/bin/promtool
          promtool --version

      - name: Test alert rules
        run: promtool test rules deploy/prometheus/binlog-server-alerts.test.yml
