# Production deployment template for BinlogServer v0.5.7.
#
# DBA Security & Durability Principles:
# 1. Non-loopback binds (:8080 or 0.0.0.0:8080) strictly mandate authentication.
# 2. In PRODUCTION=true, startup refuses to listen unless --encryption-key is provided.
# 3. Supply a 32-byte AES-256 key via process flag:
#    binlog-server --config config.production.example.yaml --encryption-key "$BINLOG_SERVER_ENCRYPTION_KEY"
# 4. Source database passwords are automatically encrypted at rest with AES-256-GCM (enc:aes256:).
# 5. Keep all credentials outside this file; inject via environment placeholders.
# 6. Metadata Isolation: If configuring meta_dsn (standalone persistence or cluster HA),
#    the metadata MySQL must be dedicated and NEVER added as a backup replication task source.

listen_addr: ":8080"
data_dir: "./data"

# Operational mode: standalone | cluster
# In standalone mode without meta_dsn, tasks run in-memory for testing.
# Set meta_dsn to persist task metadata, checkpoints, and file catalogs across restarts.
mode: "standalone"
# meta_dsn: "${BINLOG_SERVER_META_DSN}"

# Cluster configuration (uncomment when mode is cluster)
# cluster:
#   role: "control-plane" # control-plane | worker | all-in-one
#   lease_ttl_sec: 15
#   lease_renew_interval_sec: 5
#   lease_grace_sec: 30

api:
  auth:
    enabled: true
    mode: "bearer"
    bearer_token: "${BINLOG_SERVER_API_AUTH_BEARER_TOKEN}"
    protect_api: true
    protect_metrics: true
    # /ui/ loads in a browser without a header. Paste bearer_token in Console Settings.
    # /api/*, /metrics, and /swagger/* still require it. /healthz stays open.

# Decoupled S3-compatible cold storage archiving (optional, non-blocking)
# S3 upload failures will NEVER stall real-time binlog replication.
# upload:
#   endpoint: "${BINLOG_SERVER_UPLOAD_ENDPOINT}"
#   bucket: "${BINLOG_SERVER_UPLOAD_BUCKET}"
#   access_key: "${BINLOG_SERVER_UPLOAD_ACCESS_KEY}"
#   secret_key: "${BINLOG_SERVER_UPLOAD_SECRET_KEY}"
#   region: ""
#   prefix: ""
#   use_ssl: true

