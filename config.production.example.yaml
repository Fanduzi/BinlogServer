# Production deployment template for BinlogServer v0.5.6.
#
# DBA Security Principles:
# 1. Non-loopback binds (:8080 or 0.0.0.0:8080) strictly mandate authentication.
# 2. In PRODUCTION=true, startup refuses to listen unless --encryption-key is provided.
# 3. Supply a 32-byte AES-256 key via process flag:
#    binlog-server --config config.production.example.yaml --encryption-key "$BINLOG_SERVER_ENCRYPTION_KEY"
# 4. Source database passwords are automatically encrypted at rest with AES-256-GCM (enc:aes256:).
# 5. Keep all credentials outside this file; inject via environment placeholders.

listen_addr: ":8080"
data_dir: "./data"

api:
  auth:
    enabled: true
    mode: "bearer"
    bearer_token: "${BINLOG_SERVER_API_AUTH_BEARER_TOKEN}"
    protect_api: true
    protect_metrics: true

