listen_addr: ":8080"
data_dir: "./data"
meta_dsn: "${BINLOG_SERVER_META_DSN}" # 推荐用环境变量注入，避免明文口令
mode: "standalone" # standalone | cluster

cluster:
  role: "all-in-one" # control-plane | worker | all-in-one
  worker_id: ""
  worker_health_listen_addr: "" # 仅 role=worker 时生效；示例: "127.0.0.1:18081"
  lease_ttl_sec: 15
  lease_renew_interval_sec: 5
  lease_grace_sec: 30
  failover_policy: "rebuild_current_file"

upload:
  endpoint: ""
  bucket: ""
  access_key: "${BINLOG_SERVER_UPLOAD_ACCESS_KEY}" # 推荐用环境变量注入
  secret_key: "${BINLOG_SERVER_UPLOAD_SECRET_KEY}" # 推荐用环境变量注入
  region: ""
  prefix: ""
  use_ssl: false

api:
  auth:
    enabled: false # 生产环境建议改为 true 并配置凭证
    mode: "bearer" # bearer | api_key
    bearer_token: "${BINLOG_SERVER_API_AUTH_BEARER_TOKEN}" # 推荐用环境变量注入
    api_key: ""
    api_key_header: "X-API-Key"
    protect_api: false
    protect_metrics: false

http:
  control_plane:
    read_header_timeout_sec: 5
    read_timeout_sec: 30
    write_timeout_sec: 30
    idle_timeout_sec: 120
  worker_health:
    read_header_timeout_sec: 3
    read_timeout_sec: 10
    write_timeout_sec: 10
    idle_timeout_sec: 30

log:
  level: "info"
  encoding: "json" # json | console
  file: "./logs/binlog-server.log"
  max_size_mb: 100
  max_backups: 7
  max_age_days: 30
  compress: false
  rotate_interval: "24h"
