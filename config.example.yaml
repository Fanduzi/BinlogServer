# BinlogServer v0.5.79 Comprehensive Configuration Reference
#
# Rule 1 (Auth Fail-Closed):
#   - Loopback (127.0.0.1/localhost/::1) may stay unauthenticated for local testing.
#   - Non-loopback binds (:8080, 0.0.0.0:8080) strictly require api.auth.enabled: true.
# Rule 2 (Encryption Key):
#   - In PRODUCTION=true, startup refuses to listen unless --encryption-key is passed.
#   - Encryption key is a 32-byte AES process flag, not a YAML field.
# Rule 3 (Decoupled S3 Archiving):
#   - S3 upload failure never stops local binlog replication.
#   - Retry anytime via POST /api/tasks/{task_id}/files/retry-upload.

listen_addr: "127.0.0.1:8080"
data_dir: "./data"
# Leave meta_dsn commented out for standalone mode. Tasks are encrypted in
# {data_dir}/.tasks.enc. Uncomment the next line only after exporting
# BINLOG_SERVER_META_DSN to a real DSN. An unset variable is a startup error
# ("BINLOG_SERVER_META_DSN is not set; leave meta_dsn empty for standalone mode"),
# not an empty DSN. Setting the variable to an empty string is standalone mode.
# meta_dsn: "${BINLOG_SERVER_META_DSN}"
mode: "standalone" # standalone | cluster

cluster:
  role: "all-in-one" # control-plane | worker | all-in-one
  worker_id: "" # 推荐显式指定；留空则自动生成 wk-<host>-<ip>-<random> 并持久化
  worker_health_listen_addr: "" # 仅 role=worker 时生效；示例: "127.0.0.1:18081"
  lease_ttl_sec: 15
  lease_renew_interval_sec: 5
  lease_grace_sec: 30
  failover_policy: "rebuild_current_file"
  side_kill: "off" # off | auto. auto is a direct meta connection only

# Per-task retention is not a process setting. POST /api/tasks storage:
#   retention_days: 7                # required, 1..3650; both retentions when the next two are omitted
#   local_retention_days: 3          # optional; 0 or omitted = retention_days
#   bucket_retention_days: 30        # optional; must be >= local retention; needs upload and meta_dsn
# A bucket retention shorter than the local retention is rejected when the task is created or updated.
upload:
  endpoint: "" # S3 / MinIO 端点，例如: s3.us-east-1.amazonaws.com
  bucket: ""
  access_key: "${BINLOG_SERVER_UPLOAD_ACCESS_KEY}" # 推荐用环境变量注入
  secret_key: "${BINLOG_SERVER_UPLOAD_SECRET_KEY}" # 推荐用环境变量注入
  region: ""
  prefix: ""
  use_ssl: true # 默认 true（HTTPS）。明文 HTTP（例如本机 MinIO）必须写 false
  # tls:
  #   ca_file: "" # 可选。设置后只信任这份 PEM，主机名仍检查。use_ssl false 时不能写

api:
  auth:
    enabled: false # 非 loopback listen 与 PRODUCTION=true 时必须为 true
    mode: "bearer" # bearer | api_key
    bearer_token: "${BINLOG_SERVER_API_AUTH_BEARER_TOKEN}" # 推荐用环境变量注入
    api_key: ""
    api_key_header: "X-API-Key"
    # Omit protect_api / protect_metrics: when enabled=true they default to true.

http:
  control_plane:
    read_header_timeout_sec: 5
    read_timeout_sec: 30
    write_timeout_sec: 30
    idle_timeout_sec: 120
  worker_health:
    read_header_timeout_sec: 3
    read_timeout_sec: 10
    write_timeout_sec: 10
    idle_timeout_sec: 30

# ADR 0010: without meta_dsn, tasks are saved encrypted in {data_dir}/.tasks.enc
# and resume by themselves after a restart. The key comes from the env
# BINLOG_SERVER_TASK_KEY or a 0600 key file (binlog-server task-key generate --out <path>).
standalone:
  task_records: "on" # on | off
  task_key_file: ""
  task_key_previous_file: "" # the old key while rotating

meta:
  timeout:
    read_sec: 3
    write_sec: 5
    lease_sec: 2
    upload_sec: 30
  # tls.mode 默认 disabled，省略则 meta_dsn 原样使用（含 DSN 里已有的 tls=）。
  # verify-identity 示例（ca 文件必须存在，否则启动失败）：
  # tls:
  #   mode: verify-identity
  #   ca: /etc/binlog-server/ca.pem
  #   server_name: meta.example.com

# ADR 0009 phase 2 health evaluator (P2-3). off: legacy findings only;
# shadow: evaluate and log, write nothing; on: the evaluator owns
# SEGMENT_UNREADABLE, SEGMENT_OVERLAP and SEGMENT_EMPTY_LEFTOVER (needs
# migration 000009 with a metadata DSN; standalone writes .health.json).
health:
  evaluator: "off" # off | shadow | on
  sweep_interval_sec: 60
  stale_after_sec: 0 # 0 = 5x sweep; cluster HEALTH_STALE (needs evaluator: on)
  node_gone_after_sec: 0 # 0 = 3x sweep; last chain owner gone -> UNKNOWN (needs evaluator: on)
  rehash_bytes_per_sec: 4194304 # global sha256 re-check budget (4 MiB/s)

tracing:
  enabled: false
  exporter: "disabled" # disabled | otlp-http | otlp-grpc | jaeger
  endpoint: "http://127.0.0.1:4318/v1/traces"
  sample_ratio: 0.1
  service_name: "binlog-server"

log:
  level: "info"
  encoding: "json" # json | console
  file: "./logs/binlog-server.log"
  max_size_mb: 100
  max_backups: 7
  max_age_days: 30
  compress: false
  rotate_interval: "24h"
