basePath: /
definitions:
  api.apiErrorBody:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  api.batchCreateRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/api.createTaskRequest'
        type: array
    type: object
  api.batchCreateResult:
    properties:
      cluster_key:
        type: string
      error:
        $ref: '#/definitions/api.apiErrorBody'
      index:
        type: integer
      task:
        $ref: '#/definitions/tasks.Task'
    type: object
  api.clusterOverview:
    properties:
      leased_task_count:
        type: integer
      running_task_count:
        type: integer
      single_process:
        type: boolean
      task_count:
        type: integer
      worker_count:
        type: integer
      workers:
        items:
          $ref: '#/definitions/api.workerItem'
        type: array
    type: object
  api.createTaskRequest:
    properties:
      cluster_key:
        description: ClusterKey 集群标识（必填；仅允许 [a-zA-Z0-9._-]；禁止 / \ ..）。
        type: string
      name:
        description: Name 任务名（trim 后 1-255 字符）。
        type: string
      source:
        allOf:
        - $ref: '#/definitions/tasks.SourceConfig'
        description: Source 源库配置：host/user 必填且不得含空白；port 1-65535；flavor 为空默认 mysql。
      start:
        allOf:
        - $ref: '#/definitions/tasks.StartConfig'
        description: Start 起点策略：LATEST|FILE_POS|GTID。
      storage:
        allOf:
        - $ref: '#/definitions/tasks.Storage'
        description: Storage 存储策略：retention_days 必须在 1..3650。
    type: object
  api.dashboardResponse:
    properties:
      generated_at:
        type: string
      limit:
        type: integer
      offset:
        type: integer
      sources:
        items:
          $ref: '#/definitions/api.sourceOverview'
        type: array
      summary:
        $ref: '#/definitions/api.summaryResponse'
      tasks:
        items:
          $ref: '#/definitions/api.dashboardTaskItem'
        type: array
      threshold_seconds:
        type: integer
      total:
        type: integer
    type: object
  api.dashboardTaskItem:
    properties:
      replication:
        $ref: '#/definitions/api.taskReplicationResponse'
      task:
        $ref: '#/definitions/tasks.Task'
    type: object
  api.sourceLookupResponse:
    properties:
      count:
        type: integer
      exists:
        type: boolean
      host:
        type: string
      port:
        type: integer
      task_ids:
        items:
          type: string
        type: array
    type: object
  api.sourceOverview:
    properties:
      abnormal:
        type: integer
      delayed:
        type: integer
      host:
        type: string
      normal:
        type: integer
      port:
        type: integer
      running:
        type: integer
      starting:
        type: integer
      task_count:
        type: integer
    type: object
  api.summaryResponse:
    properties:
      abnormal:
        type: integer
      delayed:
        type: integer
      failed:
        type: integer
      normal:
        type: integer
      retry_backoff:
        type: integer
      running:
        type: integer
      starting:
        type: integer
      stopped:
        type: integer
      total:
        type: integer
    type: object
  api.taskLeaseView:
    properties:
      epoch:
        type: integer
      owner_worker_id:
        type: string
      state:
        $ref: '#/definitions/tasks.State'
      task_id:
        type: string
      updated_at:
        type: string
    type: object
  api.taskListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/tasks.Task'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  api.taskReplicationResponse:
    properties:
      delay_seconds:
        description: |-
          DelaySeconds is a sampled lag. Nil means there is no event-time sample, so JSON omits the field.
          A non-nil 0 is caught up. omitempty on a plain int64 would drop that zero and the Console would show "--".
        type: integer
      has_progress:
        type: boolean
      last_error:
        type: string
      last_event_at:
        type: string
      last_event_file:
        type: string
      last_event_pos:
        type: integer
      reason:
        type: string
      state:
        $ref: '#/definitions/tasks.State'
      status:
        type: string
      task_id:
        type: string
      threshold_seconds:
        type: integer
      updated_at:
        type: string
    type: object
  api.taskRunView:
    properties:
      end_reason:
        type: string
      ended_at:
        type: string
      epoch:
        type: integer
      run_id:
        type: string
      started_at:
        type: string
      task_id:
        type: string
      worker_id:
        type: string
    type: object
  api.updateTaskRequest:
    properties:
      cluster_key:
        description: ClusterKey 集群标识（必填；仅允许 [a-zA-Z0-9._-]；禁止 / \ ..）。
        type: string
      name:
        description: Name 任务名（trim 后 1-255 字符）。
        type: string
      source:
        allOf:
        - $ref: '#/definitions/tasks.SourceConfig'
        description: Source 源库配置：host/user 必填且不得含空白；port 1-65535；flavor 为空默认 mysql。
      start:
        allOf:
        - $ref: '#/definitions/tasks.StartConfig'
        description: Start 起点策略：LATEST|FILE_POS|GTID。
      storage:
        allOf:
        - $ref: '#/definitions/tasks.Storage'
        description: Storage 存储策略：retention_days 必须在 1..3650。
    type: object
  api.workerItem:
    properties:
      has_updated:
        type: boolean
      host:
        type: string
      last_seen_at:
        type: string
      leased:
        type: integer
      online:
        type: boolean
      running:
        type: integer
      status:
        type: string
      task_count:
        type: integer
      updated_at:
        type: string
      version:
        type: string
      worker_id:
        type: string
    type: object
  binlog.Checkpoint:
    properties:
      file:
        type: string
      gtid_set:
        type: string
      pos:
        type: integer
      updated_at:
        type: string
    type: object
  tasks.BinlogFile:
    properties:
      checksum:
        type: string
      created_at:
        type: string
      end_pos:
        type: integer
      file_name:
        type: string
      file_path:
        type: string
      object_key:
        type: string
      sealed_at:
        type: string
      size_bytes:
        type: integer
      start_pos:
        type: integer
      state:
        type: string
      task_id:
        type: string
      upload_error:
        type: string
      upload_state:
        type: string
      uploaded_at:
        type: string
    type: object
  tasks.ReplaySet:
    properties:
      client:
        type: string
      client_hint:
        type: string
      flavor:
        type: string
      paths:
        items:
          type: string
        type: array
    type: object
  tasks.SourceConfig:
    properties:
      flavor:
        type: string
      host:
        type: string
      password:
        description: 仅用于输入，API 响应前会清空
        type: string
      port:
        type: integer
      semi_sync:
        description: SemiSync=true 时尝试以 semi-sync 协议拉流；主库不支持时会自动降级为异步。
        type: boolean
      server_id:
        type: integer
      user:
        type: string
    type: object
  tasks.StartConfig:
    properties:
      file:
        type: string
      gtid_set:
        type: string
      mode:
        $ref: '#/definitions/tasks.StartMode'
      pos:
        type: integer
    type: object
  tasks.StartMode:
    enum:
    - LATEST
    - FILE_POS
    - GTID
    type: string
    x-enum-varnames:
    - StartModeLatest
    - StartModeFilePos
    - StartModeGTID
  tasks.State:
    enum:
    - CREATED
    - STARTING
    - RUNNING
    - LEASE_DEGRADED
    - REBUILDING_FILE
    - RETRY_BACKOFF
    - FAILED
    - STOPPING
    - STOPPED
    type: string
    x-enum-varnames:
    - StateCreated
    - StateStarting
    - StateRunning
    - StateLeaseDegraded
    - StateRebuildingFile
    - StateRetryBackoff
    - StateFailed
    - StateStopping
    - StateStopped
  tasks.Storage:
    properties:
      dir:
        type: string
      retention_days:
        type: integer
    type: object
  tasks.Task:
    properties:
      cluster_key:
        type: string
      epoch:
        type: integer
      id:
        type: string
      last_error:
        type: string
      name:
        type: string
      owner_worker_id:
        type: string
      run_id:
        type: string
      source:
        $ref: '#/definitions/tasks.SourceConfig'
      start:
        $ref: '#/definitions/tasks.StartConfig'
      state:
        $ref: '#/definitions/tasks.State'
      storage:
        $ref: '#/definitions/tasks.Storage'
      updated_at:
        type: string
    type: object
  tasks.TaskEvent:
    properties:
      detail:
        type: string
      message:
        type: string
      sequence:
        type: integer
      task_id:
        type: string
      time:
        type: string
      type:
        type: string
    type: object
  tasks.UploadFailureReason:
    properties:
      count:
        type: integer
      latest_time:
        type: string
      reason:
        type: string
    type: object
  tasks.UploadRetryStats:
    properties:
      failed:
        type: integer
      scanned:
        type: integer
      skipped:
        type: integer
      succeeded:
        type: integer
    type: object
info:
  contact: {}
  description: Centralized MySQL binlog backup service API.
  title: Binlog Server API
  version: 0.1.0
paths:
  /api/cluster/overview:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.clusterOverview'
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get cluster overview
      tags:
      - Cluster
  /api/dashboard:
    get:
      parameters:
      - description: Filter by source host; localhost and explicit loopback literals
          share one identity, other hosts match exact spelling
        in: query
        name: host
        type: string
      - description: Filter by source port
        in: query
        name: port
        type: integer
      - description: Filter by task state
        in: query
        name: state
        type: string
      - description: Page size (default 100, range 1-500; values above 500 return
          400)
        in: query
        name: limit
        type: integer
      - description: Zero-based page offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.dashboardResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: Get task dashboard with replication delay overview
      tags:
      - Dashboard
  /api/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Service health check (JSON)
      tags:
      - System
  /api/sources/lookup:
    get:
      parameters:
      - description: MySQL source host (required); localhost and explicit loopback
          literals (127/8, ::1, including bracketed IPv6) share one identity, other
          hosts match exact spelling
        in: query
        name: host
        required: true
        type: string
      - description: MySQL source port (required, 1-65535)
        in: query
        name: port
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.sourceLookupResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: Lookup tasks by source host and port
      tags:
      - Dashboard
  /api/summary:
    get:
      parameters:
      - description: Filter by source host; localhost and explicit loopback literals
          share one identity, other hosts match exact spelling
        in: query
        name: host
        type: string
      - description: Filter by source port
        in: query
        name: port
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.summaryResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: Get task summary counters
      tags:
      - Dashboard
  /api/tasks:
    get:
      parameters:
      - description: Filter by source host; localhost and explicit loopback literals
          share one identity, other hosts match exact spelling
        in: query
        name: host
        type: string
      - description: Filter by source port
        in: query
        name: port
        type: integer
      - description: Filter by task state (CREATED, STARTING, RUNNING, LEASE_DEGRADED,
          REBUILDING_FILE, RETRY_BACKOFF, FAILED, STOPPING, STOPPED)
        in: query
        name: state
        type: string
      - description: Page size (default 100, range 1-500; values above 500 return
          400 invalid limit)
        in: query
        name: limit
        type: integer
      - description: Zero-based page offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.taskListResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: List tasks
      tags:
      - Tasks
    post:
      consumes:
      - application/json
      parameters:
      - description: Task create payload (name:1-255, cluster_key:[a-zA-Z0-9._-],
          source/start/storage 按字段规则校验)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tasks.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiErrorBody'
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: Create or list tasks
      tags:
      - Tasks
  /api/tasks/{id}:
    delete:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Delete task
      tags:
      - Tasks
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tasks.Task'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get task by ID
      tags:
      - Tasks
    put:
      consumes:
      - application/json
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Task update payload（cluster_key 必填，仅允许 [a-zA-Z0-9._-]，禁止 / \\
          ..；name/source/start/storage 按字段规则校验）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.updateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tasks.Task'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Update task configuration
      tags:
      - Tasks
  /api/tasks/{id}/adopt:
    post:
      consumes:
      - application/json
      description: Attaches cluster_key and source to a standalone disk-discovered
        task id. Omitted start resumes at FILE_POS at the size of the highest local
        segment. Does not start replication.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: cluster_key and source (host/port/user/password/flavor) are required.
          name, start, and storage are optional.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.updateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tasks.Task'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Adopt a leftover on-disk task directory
      tags:
      - Tasks
  /api/tasks/{id}/checkpoint:
    get:
      description: Returns the file, pos, and gtid_set the next Start continues from.
        A local open segment with a complete event wins over the stored checkpoint.
        gtid_set is included when that stored checkpoint has the same file and pos.
        With no local event, the stored checkpoint is returned. Epoch greater than
        1 rewinds pos to 4 only when the catalog has no row for that tail. A readable
        binlog_files.file_path continues from the last complete event in that
        directory. A checkpoint inside a sealed UPLOADED object is not rewound.
        An unreadable open segment returns the stored checkpoint; Start then fails
        with SEGMENT_NOT_ON_WORKER and does not open a new directory. 404 when
        neither exists.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/binlog.Checkpoint'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get task checkpoint
      tags:
      - Tasks
  /api/tasks/{id}/events:
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Event list limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/tasks.TaskEvent'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List task events
      tags:
      - Tasks
  /api/tasks/{id}/files:
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: File list limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/tasks.BinlogFile'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List binlog file metadata
      tags:
      - Tasks
  /api/tasks/{id}/files/{name}:
    get:
      description: Streams one basename already listed by GET /api/tasks/{id}/files.
        Content-Type is application/octet-stream and Content-Disposition filename
        is that basename. A file at {data_dir}/{id}/{name} is served at its size at
        open, including *.open.e* while the task is RUNNING or STOPPED. When that
        file is missing, a sealed row with upload_state UPLOADED and a non-empty object_key
        is read from the configured object store, and the body length is the object
        size at open. LOCAL_ONLY, UPLOAD_FAILED, an empty object_key, an open segment
        with no local file, or object upload not configured is 404 segment not found
        on this process. Catalog file_path is not a byte source. A slash, backslash,
        or .. is 400. A missing task is 404.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: On-disk basename
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: raw binlog bytes
          schema:
            type: file
        "400":
          description: invalid segment name
          schema:
            type: string
        "404":
          description: task not found or segment not on this process
          schema:
            type: string
      summary: Download one inventory binlog segment
      tags:
      - Tasks
  /api/tasks/{id}/files/retry-upload:
    post:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - default: 100
        description: Retry upload limit
        in: query
        maximum: 1000
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tasks.UploadRetryStats'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Retry failed upload binlog files
      tags:
      - Tasks
  /api/tasks/{id}/lease:
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.taskLeaseView'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get task lease info
      tags:
      - Cluster
  /api/tasks/{id}/replay:
    get:
      description: One on-disk file_path per source index, ascending. When a sealed
        name and .open.e* share an index, the path is the highest-epoch open segment.
        limit is the same inventory window as GET /files. client is mysqlbinlog or
        mariadb-binlog from source.flavor.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Inventory window limit (same as files)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tasks.ReplaySet'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List the mysqlbinlog replay set for a task
      tags:
      - Tasks
  /api/tasks/{id}/replay/archive:
    get:
      description: 'USTAR archive whose members are the basenames from GET /api/tasks/{id}/replay
        for the same limit, one per source index. A sealed name and .open.e* still
        keep the highest-epoch open segment. Each member uses the GET /api/tasks/{id}/files/{name}
        open rules: a local file wins, including *.open.e* while RUNNING or STOPPED;
        a missing local file is read only for a sealed UPLOADED row with a non-empty
        object_key. An empty selection is 200 and an empty tar. If any selected segment
        cannot be opened, the response is an error and the body is not a tar. A missing
        task is 404 task not found.'
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Inventory window limit (same as replay)
        in: query
        name: limit
        type: integer
      produces:
      - application/x-tar
      responses:
        "200":
          description: ustar archive task-{id}-replay.tar
          schema:
            type: file
        "400":
          description: invalid segment name
          schema:
            type: string
        "404":
          description: task not found or segment not found on this process
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Download the mysqlbinlog replay set as one tar
      tags:
      - Tasks
