basePath: /
definitions:
  api.clusterOverview:
    properties:
      leased_task_count:
        type: integer
      running_task_count:
        type: integer
      task_count:
        type: integer
      worker_count:
        type: integer
      workers:
        items:
          $ref: '#/definitions/api.workerItem'
        type: array
    type: object
  api.createTaskRequest:
    properties:
      cluster_key:
        description: ClusterKey 集群标识（必填；仅允许 [a-zA-Z0-9._-]；禁止 / \ ..）。
        type: string
      name:
        description: Name 任务名（trim 后 1-255 字符）。
        type: string
      source:
        allOf:
        - $ref: '#/definitions/tasks.SourceConfig'
        description: Source 源库配置：host/user 必填且不得含空白；port 1-65535；flavor 为空默认 mysql。
      start:
        allOf:
        - $ref: '#/definitions/tasks.StartConfig'
        description: Start 起点策略：LATEST|FILE_POS|GTID。
      storage:
        allOf:
        - $ref: '#/definitions/tasks.Storage'
        description: Storage 存储策略：retention_days 必须在 1..3650。
    type: object
  api.dashboardResponse:
    properties:
      generated_at:
        type: string
      sources:
        items:
          $ref: '#/definitions/api.sourceOverview'
        type: array
      summary:
        $ref: '#/definitions/api.summaryResponse'
      tasks:
        items:
          $ref: '#/definitions/api.dashboardTaskItem'
        type: array
      threshold_seconds:
        type: integer
    type: object
  api.dashboardTaskItem:
    properties:
      replication:
        $ref: '#/definitions/api.taskReplicationResponse'
      task:
        $ref: '#/definitions/tasks.Task'
    type: object
  api.sourceLookupResponse:
    properties:
      count:
        type: integer
      exists:
        type: boolean
      host:
        type: string
      port:
        type: integer
      task_ids:
        items:
          type: string
        type: array
    type: object
  api.sourceOverview:
    properties:
      abnormal:
        type: integer
      delayed:
        type: integer
      host:
        type: string
      normal:
        type: integer
      port:
        type: integer
      running:
        type: integer
      starting:
        type: integer
      task_count:
        type: integer
    type: object
  api.summaryResponse:
    properties:
      abnormal:
        type: integer
      delayed:
        type: integer
      failed:
        type: integer
      normal:
        type: integer
      retry_backoff:
        type: integer
      running:
        type: integer
      starting:
        type: integer
      stopped:
        type: integer
      total:
        type: integer
    type: object
  api.taskLeaseView:
    properties:
      epoch:
        type: integer
      owner_worker_id:
        type: string
      state:
        $ref: '#/definitions/tasks.State'
      task_id:
        type: string
      updated_at:
        type: string
    type: object
  api.taskReplicationResponse:
    properties:
      delay_seconds:
        type: integer
      has_progress:
        type: boolean
      last_error:
        type: string
      last_event_at:
        type: string
      last_event_file:
        type: string
      last_event_pos:
        type: integer
      reason:
        type: string
      state:
        $ref: '#/definitions/tasks.State'
      status:
        type: string
      task_id:
        type: string
      threshold_seconds:
        type: integer
      updated_at:
        type: string
    type: object
  api.taskRunView:
    properties:
      end_reason:
        type: string
      ended_at:
        type: string
      epoch:
        type: integer
      run_id:
        type: string
      started_at:
        type: string
      task_id:
        type: string
      worker_id:
        type: string
    type: object
  api.updateTaskRequest:
    properties:
      cluster_key:
        description: ClusterKey 集群标识（必填；仅允许 [a-zA-Z0-9._-]；禁止 / \ ..）。
        type: string
      name:
        description: Name 任务名（trim 后 1-255 字符）。
        type: string
      source:
        allOf:
        - $ref: '#/definitions/tasks.SourceConfig'
        description: Source 源库配置：host/user 必填且不得含空白；port 1-65535；flavor 为空默认 mysql。
      start:
        allOf:
        - $ref: '#/definitions/tasks.StartConfig'
        description: Start 起点策略：LATEST|FILE_POS|GTID。
      storage:
        allOf:
        - $ref: '#/definitions/tasks.Storage'
        description: Storage 存储策略：retention_days 必须在 1..3650。
    type: object
  api.workerItem:
    properties:
      has_updated:
        type: boolean
      host:
        type: string
      last_seen_at:
        type: string
      leased:
        type: integer
      online:
        type: boolean
      running:
        type: integer
      status:
        type: string
      task_count:
        type: integer
      updated_at:
        type: string
      version:
        type: string
      worker_id:
        type: string
    type: object
  binlog.Checkpoint:
    properties:
      file:
        type: string
      gtid_set:
        type: string
      pos:
        type: integer
      updated_at:
        type: string
    type: object
  tasks.BinlogFile:
    properties:
      created_at:
        type: string
      end_pos:
        type: integer
      file_name:
        type: string
      file_path:
        type: string
      object_key:
        type: string
      sealed_at:
        type: string
      size_bytes:
        type: integer
      start_pos:
        type: integer
      state:
        type: string
      task_id:
        type: string
      upload_error:
        type: string
      upload_state:
        type: string
      uploaded_at:
        type: string
    type: object
  tasks.SourceConfig:
    properties:
      flavor:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: integer
      semi_sync:
        description: SemiSync=true 时尝试以 semi-sync 协议拉流；主库不支持时会自动降级为异步。
        type: boolean
      server_id:
        type: integer
      user:
        type: string
    type: object
  tasks.StartConfig:
    properties:
      file:
        type: string
      gtid_set:
        type: string
      mode:
        $ref: '#/definitions/tasks.StartMode'
      pos:
        type: integer
    type: object
  tasks.StartMode:
    enum:
    - LATEST
    - FILE_POS
    - GTID
    type: string
    x-enum-varnames:
    - StartModeLatest
    - StartModeFilePos
    - StartModeGTID
  tasks.State:
    enum:
    - CREATED
    - STARTING
    - RUNNING
    - LEASE_DEGRADED
    - REBUILDING_FILE
    - RETRY_BACKOFF
    - FAILED
    - STOPPING
    - STOPPED
    type: string
    x-enum-varnames:
    - StateCreated
    - StateStarting
    - StateRunning
    - StateLeaseDegraded
    - StateRebuildingFile
    - StateRetryBackoff
    - StateFailed
    - StateStopping
    - StateStopped
  tasks.Storage:
    properties:
      dir:
        type: string
      retention_days:
        type: integer
    type: object
  tasks.Task:
    properties:
      cluster_key:
        type: string
      epoch:
        type: integer
      id:
        type: string
      last_error:
        type: string
      name:
        type: string
      owner_worker_id:
        type: string
      run_id:
        type: string
      source:
        $ref: '#/definitions/tasks.SourceConfig'
      start:
        $ref: '#/definitions/tasks.StartConfig'
      state:
        $ref: '#/definitions/tasks.State'
      storage:
        $ref: '#/definitions/tasks.Storage'
      updated_at:
        type: string
    type: object
  tasks.TaskEvent:
    properties:
      detail:
        type: string
      message:
        type: string
      sequence:
        type: integer
      task_id:
        type: string
      time:
        type: string
      type:
        type: string
    type: object
  tasks.UploadFailureReason:
    properties:
      count:
        type: integer
      latest_time:
        type: string
      reason:
        type: string
    type: object
  tasks.UploadRetryStats:
    properties:
      failed:
        type: integer
      scanned:
        type: integer
      skipped:
        type: integer
      succeeded:
        type: integer
    type: object
info:
  contact: {}
  description: Centralized MySQL binlog backup service API.
  title: Binlog Server API
  version: 0.1.0
paths:
  /api/cluster/overview:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.clusterOverview'
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: Get cluster overview
      tags:
      - Cluster
  /api/dashboard:
    get:
      parameters:
      - description: Filter by source host
        in: query
        name: host
        type: string
      - description: Filter by source port
        in: query
        name: port
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.dashboardResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: Get task dashboard with replication delay overview
      tags:
      - Dashboard
  /api/sources/lookup:
    get:
      parameters:
      - description: MySQL source host (required); localhost and explicit loopback
          literals (127/8, ::1, including bracketed IPv6) share one identity, other
          hosts match exact spelling
        in: query
        name: host
        required: true
        type: string
      - description: MySQL source port
        in: query
        name: port
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.sourceLookupResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: Lookup tasks by source host and port
      tags:
      - Dashboard
  /api/summary:
    get:
      parameters:
      - description: Filter by source host
        in: query
        name: host
        type: string
      - description: Filter by source port
        in: query
        name: port
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.summaryResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: Get task summary counters
      tags:
      - Dashboard
  /api/tasks:
    get:
      consumes:
      - application/json
      parameters:
      - description: Filter by source host (GET only)
        in: query
        name: host
        type: string
      - description: Filter by source port (GET only)
        in: query
        name: port
        type: integer
      - description: Task create payload (name:1-255, cluster_key:[a-zA-Z0-9._-],
          source/start/storage 按字段规则校验)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/tasks.Task'
            type: array
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tasks.Task'
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: Create or list tasks
      tags:
      - Tasks
    post:
      consumes:
      - application/json
      parameters:
      - description: Filter by source host (GET only)
        in: query
        name: host
        type: string
      - description: Filter by source port (GET only)
        in: query
        name: port
        type: integer
      - description: Task create payload (name:1-255, cluster_key:[a-zA-Z0-9._-],
          source/start/storage 按字段规则校验)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/tasks.Task'
            type: array
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tasks.Task'
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: Create or list tasks
      tags:
      - Tasks
  /api/tasks/{id}:
    delete:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Delete task
      tags:
      - Tasks
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tasks.Task'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get task by ID
      tags:
      - Tasks
    put:
      consumes:
      - application/json
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Task update payload（cluster_key 必填，仅允许 [a-zA-Z0-9._-]，禁止 / \\
          ..；name/source/start/storage 按字段规则校验）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.updateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tasks.Task'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Update task configuration
      tags:
      - Tasks
  /api/tasks/{id}/checkpoint:
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/binlog.Checkpoint'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get task checkpoint
      tags:
      - Tasks
  /api/tasks/{id}/events:
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Event list limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/tasks.TaskEvent'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List task events
      tags:
      - Tasks
  /api/tasks/{id}/files:
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: File list limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/tasks.BinlogFile'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List binlog file metadata
      tags:
      - Tasks
  /api/tasks/{id}/files/retry-upload:
    post:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - default: 100
        description: Retry upload limit
        in: query
        maximum: 1000
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tasks.UploadRetryStats'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Retry failed upload binlog files
      tags:
      - Tasks
  /api/tasks/{id}/lease:
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.taskLeaseView'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get task lease info
      tags:
      - Cluster
  /api/tasks/{id}/replication:
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.taskReplicationResponse'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get task replication delay and latest position
      tags:
      - Tasks
  /api/tasks/{id}/runs:
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Run history limit (default 10, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.taskRunView'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List task run sessions
      tags:
      - Cluster
  /api/tasks/{id}/start:
    post:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Start task
      tags:
      - Tasks
  /api/tasks/{id}/stop:
    post:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Stop task
      tags:
      - Tasks
  /api/tasks/{id}/upload-failures/reasons:
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - default: 20
        description: Failure reason list limit
        in: query
        maximum: 200
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/tasks.UploadFailureReason'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Aggregate upload failure reasons
      tags:
      - Tasks
  /api/workers:
    get:
      parameters:
      - description: Workers list limit (max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.workerItem'
            type: array
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: List cluster workers
      tags:
      - Cluster
  /healthz:
    get:
      responses:
        "200":
          description: ok
          schema:
            type: string
      summary: Service health check
      tags:
      - System
swagger: "2.0"
